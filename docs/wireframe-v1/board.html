<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자취도우미 화면 흐름 · 와이어프레임</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#edf0ee;color:#222b25;font-family:"Malgun Gothic",Arial,sans-serif;letter-spacing:0}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}h1{font-size:22px;margin:0}header p{font-size:13px;color:#657066;margin:8px 0 0}a{color:#31574b}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.frame{min-width:0}h2{font-size:14px;margin:0 0 10px;font-weight:700}.viewport{width:100%;aspect-ratio:390/844;overflow:hidden;border:1px solid #bdc9c1;background:white}.viewport iframe{border:0;width:390px;height:844px;transform-origin:top left}.frame p{font-size:12px;line-height:1.7;margin:10px 0;color:#526056}@media(max-width:900px){.frames{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){body{padding:18px}.frames{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column;gap:8px}}</style></head><body><header><div><h1>자취도우미 · 와이어프레임 v1</h1><p>정보 순서와 이동 경로 검토용 · 최종 디자인 아님</p></div><a href="index.html">시안 열기</a></header><main class="frames"><section class="frame"><h2>01 상품 목록</h2><div class="viewport"><iframe title="상품 목록" src="index.html#products?item=P051"></iframe></div><p>검색 → 품목/조건 → 특징과 판매처 이동. 비교는 선택 사항.</p></section><section class="frame"><h2>02 상품 차이 비교</h2><div class="viewport"><iframe title="상품 차이 비교" src="index.html#compare?item=P051"></iframe></div><p>상단에 제품과 판매처 이동. 같은 항목끼리 나란히 비교.</p></section><section class="frame"><h2>03 우리동네</h2><div class="viewport"><iframe title="우리동네" src="index.html#neighborhood"></iframe></div><p>지역 → 업종 → 검색. 상호·설명·주소·위치 행동이 한 항목 안에.</p></section><section class="frame"><h2>04 생활 앱</h2><div class="viewport"><iframe title="생활 앱" src="index.html#apps?category=laundry"></iframe></div><p>필요한
